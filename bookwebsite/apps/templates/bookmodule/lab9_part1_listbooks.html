<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List Books - Part 1</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 5px 10px; text-decoration: none; border-radius: 4px; color: white; }
        .btn-add { background-color: #28a745; display: inline-block; margin-bottom: 10px; }
        .btn-edit { background-color: #007bff; }
        .btn-delete { background-color: #dc3545; }
    </style>
</head>
<body>
    <h1>Books List</h1>
    <a href="/books/lab9_part1/addbook/" class="btn btn-add">+ Add New Book</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Rating</th>
                <th>Publisher</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.id }}</td>
                <td>{{ book.title }}</td>
                <td>{{ book.price }}</td>
                <td>{{ book.quantity }}</td>
                <td>{{ book.rating }}</td>
                <td>{{ book.publisher.name|default:"N/A" }}</td>
                <td>
                    <a href="/books/lab9_part1/editbook/{{ book.id }}/" class="btn btn-edit">Edit</a>
                    <a href="/books/lab9_part1/deletebook/{{ book.id }}/" class="btn btn-delete" onclick="return confirm('Are you sure you want to delete this book?');">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="7">No books found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
