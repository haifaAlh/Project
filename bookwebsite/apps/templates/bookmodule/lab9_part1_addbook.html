<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book - Part 1</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        a { display: inline-block; margin-top: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <h1>Add New Book</h1>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Title:</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>Price:</label>
            <input type="number" step="0.01" name="price" required>
        </div>
        <div class="form-group">
            <label>Quantity:</label>
            <input type="number" name="quantity" required>
        </div>
        <div class="form-group">
            <label>Publication Date:</label>
            <input type="date" name="pubdate" required>
        </div>
        <div class="form-group">
            <label>Rating (1-5):</label>
            <input type="number" min="1" max="5" name="rating" required>
        </div>
        <div class="form-group">
            <label>Publisher:</label>
            <select name="publisher" required>
                <option value="">-- Select Publisher --</option>
                {% for publisher in publishers %}
                    <option value="{{ publisher.id }}">{{ publisher.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit">Save Book</button>
    </form>

    <a href="/books/lab9_part1/listbooks/">Back to Books List</a>
</body>
</html>
