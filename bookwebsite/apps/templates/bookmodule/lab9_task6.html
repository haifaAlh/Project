<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 6 - Filtered Books Count per Publisher</title>
    <style>
        body { font-family: Arial, sans-serif; direction: ltr; text-align: left; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Task 6: Count of Books per Publisher (Price > 50 & 1 <= Quantity < 5)</h1>
    
    <table>
        <thead>
            <tr>
                <th>Publisher Name</th>
                <th>Location</th>
                <th>Filtered Books Count</th>
            </tr>
        </thead>
        <tbody>
            {% for publisher in publishers %}
            <tr>
                <td>{{ publisher.name }}</td>
                <td>{{ publisher.location }}</td>
                <td>{{ publisher.filtered_books_count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
